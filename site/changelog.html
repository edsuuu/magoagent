<main class="largura" style="padding-top:48px;padding-bottom:40px;max-width:860px">
  <h1 class="mao" style="font-size:clamp(2.4rem,6vw,3.4rem);margin:0 0 8px">Changelog</h1>
  <p class="intro">O que mudou em cada versão, com os arquivos para baixar.</p>
  <div id="versoes" aria-live="polite"><p class="suave">Carregando as versões…</p></div>
</main>

<footer>
  <div class="largura">
    <span class="mao">MagoAgent</span>
    <a href="./">Início</a>
    <a href="https://github.com/edsuuu/magoagent/releases">Releases no GitHub</a>
  </div>
</footer>

<script>
var paginaReleases = "https://github.com/edsuuu/magoagent/releases";
var versoes = document.getElementById("versoes");

function elemento(tag, classe, texto) {
  var novo = document.createElement(tag);
  if (classe) novo.className = classe;
  if (texto != null) novo.textContent = texto;
  return novo;
}

// Markdown simples das notas, montado com nós do DOM (texto sempre por textContent, nunca innerHTML):
// títulos (#), listas (- ou *), parágrafos, **negrito**, `código` e [links](https://...).
// shortcut: sem listas aninhadas, tabelas nem blocos de código; ampliar se as notas passarem a usar.
function emLinha(destino, texto) {
  var padrao = /\*\*(.+?)\*\*|`([^`]+)`|\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, inicio = 0, achado;
  while ((achado = padrao.exec(texto))) {
    destino.appendChild(document.createTextNode(texto.slice(inicio, achado.index)));
    if (achado[1] != null) emLinha(destino.appendChild(elemento("strong")), achado[1]);
    else if (achado[2] != null) destino.appendChild(elemento("code", null, achado[2]));
    else {
      var link = elemento("a", null, achado[3]);
      link.href = achado[4];
      link.rel = "noopener";
      destino.appendChild(link);
    }
    inicio = padrao.lastIndex;
  }
  destino.appendChild(document.createTextNode(texto.slice(inicio)));
}
function notas(markdown) {
  var caixa = elemento("div", "notas"), lista = null, paragrafo = null;
  (markdown || "").replace(/\r/g, "").split("\n").forEach(function (linha) {
    var titulo = linha.match(/^\s*#{1,6}\s+(.*)$/), item = linha.match(/^\s*[-*]\s+(.*)$/);
    if (titulo) {
      lista = paragrafo = null;
      emLinha(caixa.appendChild(elemento("h3")), titulo[1]);
    } else if (item) {
      paragrafo = null;
      if (!lista) lista = caixa.appendChild(elemento("ul"));
      emLinha(lista.appendChild(elemento("li")), item[1]);
    } else if (!linha.trim()) {
      lista = paragrafo = null;
    } else if (lista && /^\s+/.test(linha)) {
      emLinha(lista.lastChild, " " + linha.trim());
    } else {
      lista = null;
      if (paragrafo) paragrafo.appendChild(document.createTextNode(" "));
      else paragrafo = caixa.appendChild(elemento("p"));
      emLinha(paragrafo, linha.trim());
    }
  });
  return caixa;
}

function rotulo(nome) {
  if (/\.msi$/i.test(nome)) return "Windows (.msi)";
  if (/\.exe$/i.test(nome)) return "Windows (.exe)";
  if (/\.deb$/i.test(nome)) return "Linux (.deb)";
  if (/\.tar\.gz$/i.test(nome)) return "Linux (.tar.gz)";
  if (/\.dmg$/i.test(nome)) return "macOS (.dmg)";
  return nome;
}
function versao(release, primeira) {
  var cartao = elemento("article", "cartao versao" + (primeira ? " destaque" : ""));
  var topo = cartao.appendChild(elemento("header"));
  topo.appendChild(elemento("h2", "mao", release.name || release.tag_name));
  if (primeira) topo.appendChild(elemento("span", "etiqueta", "Última versão"));
  if (release.prerelease) topo.appendChild(elemento("span", "etiqueta", "Prévia"));
  var data = elemento("time", "suave", new Date(release.published_at).toLocaleDateString("pt-BR", { day: "numeric", month: "long", year: "numeric" }));
  data.dateTime = release.published_at;
  topo.appendChild(data);
  cartao.appendChild(notas(release.body));
  var arquivos = (release.assets || []).filter(function (a) { return /\.(msi|exe|deb|dmg)$|\.tar\.gz$/i.test(a.name); });
  if (arquivos.length) {
    var botoes = cartao.appendChild(elemento("div", "arquivos"));
    arquivos.forEach(function (arquivo) {
      var link = elemento("a", primeira ? "botao" : "botao sec", (primeira ? "Baixar " : "") + rotulo(arquivo.name));
      link.href = arquivo.browser_download_url;
      link.title = arquivo.name + " · " + (arquivo.size / 1048576).toFixed(1) + " MB";
      botoes.appendChild(link);
    });
  }
  var noGithub = elemento("a", null, "Ver no GitHub");
  noGithub.href = release.html_url;
  var rodape = cartao.appendChild(elemento("p", "suave"));
  rodape.style.margin = "12px 0 0";
  rodape.appendChild(noGithub);
  return cartao;
}
function falhou() {
  versoes.textContent = "";
  var aviso = versoes.appendChild(elemento("p", "suave", "Não deu para carregar as versões agora. Veja todas na "));
  var link = elemento("a", null, "página de releases do GitHub");
  link.href = paginaReleases;
  aviso.appendChild(link);
  aviso.appendChild(document.createTextNode("."));
}

fetch("https://api.github.com/repos/edsuuu/magoagent/releases?per_page=30")
  .then(function (resposta) { if (!resposta.ok) throw 0; return resposta.json(); })
  .then(function (lista) {
    lista = lista.filter(function (release) { return !release.draft; });
    if (!lista.length) return falhou();
    versoes.textContent = "";
    lista.forEach(function (release, indice) { versoes.appendChild(versao(release, indice === 0)); });
  })
  .catch(falhou);
</script>
</body>
</html>
