# Uma tag v* gera o MSI do Windows e os pacotes do Linux (.tar.gz e .deb) numa release em RASCUNHO: publicar é decisão
# do dono (os arquivos sobem com o gh, que já vem no runner). Publicada, o pages.yml põe o .deb no repositório apt (GitHub Pages).
# Os pacotes compilam junto com o CI (antes esperavam por ele: uns 9 minutos a mais); o rascunho e os arquivos só
# aparecem depois que o CI passa.
name: Release
on:
  push:
    tags: ["v*"]
  # o auto-merge.yml cria a tag com o GITHUB_TOKEN (que não dispara push) e chama a release por aqui, com --ref na tag
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # o CI pede para cancelar a si mesmo quando um job falha
    permissions:
      contents: read
      actions: write

  # a tag v0.0.17 com o Cargo.toml em 0.0.16 geraria um MSI com o nome errado e o atualizador nunca o acharia
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: A tag bate com a versão do Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::a tag $GITHUB_REF_NAME não bate com a versão $version do Cargo.toml: ajuste a versão ou a tag"
            exit 1
          fi

  # o rascunho com os pacotes, só com o CI e os dois builds prontos
  draft:
    needs: [ci, version, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4.1.8
        with:
          pattern: pacote-*
          merge-multiple: true
          path: pacotes
      # para quem baixa à mão; o atualizador do app confere pelo sha256 que o GitHub publica de cada arquivo
      - name: Somas sha256
        working-directory: pacotes
        run: sha256sum -- * > SHA256SUMS.txt
      # as notas no formato que o cartão "O que há de novo" do app mostra (updates.rs): "## Novo" e um item por PR
      # juntado desde a última release, sem os PRs que só sobem a versão; o dono revisa no rascunho antes de publicar
      - name: Notas da release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body |
            sed -n 's#^\* \(.*\) by @[^ ]* in https://github\.com/[^ ]*/pull/\([0-9]*\)$#- \1 (\#\2)#p' |
            grep -vE '^- (Versão )?[0-9]+\.[0-9]+\.[0-9]+' > itens.md || true
          if [ -s itens.md ]; then { echo "## Novo"; cat itens.md; } > notas.md; else : > notas.md; fi
          cat notas.md
      - name: O rascunho da release, com os pacotes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "MagoAgent AlphaVersion $GITHUB_REF_NAME" --notes-file notas.md
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber pacotes/*

  windows:
    needs: [version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.100.0
      # nada de cache gravado na tag: só ela o usaria (ver ci.yml)
      - uses: Swatinem/rust-cache@v2.8.1
        with:
          save-if: false
      - name: WiX 3
        shell: bash
        run: |
          curl -sSL -o wix.zip https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip
          mkdir -p "$HOME/tools/wix314/bin" && unzip -q wix.zip -d "$HOME/tools/wix314/bin"
      - name: MSI
        shell: bash
        run: sh installer/build-msi.sh
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: pacote-windows
          path: target/release/MagoAgent-*.msi
          if-no-files-found: error

  linux:
    needs: [version]
    # the oldest Ubuntu still supported: the .deb asks for its libraries' versions, which the newer ones have
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.100.0
      # nada de cache gravado na tag: só ela o usaria (ver ci.yml)
      - uses: Swatinem/rust-cache@v2.8.1
        with:
          save-if: false
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libasound2-dev libdbus-1-dev libxkbcommon-dev libwayland-dev libssl-dev libwebkit2gtk-4.1-dev dpkg-dev
      - run: cargo build --release
      - name: Pacotes (.tar.gz e .deb)
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tar -czf "MagoAgent-$version-linux-x86_64.tar.gz" -C target/release magoagent
          sh installer/build-deb.sh
          # ao lado do .tar.gz: o artefato guarda o caminho a partir da pasta comum, e o rascunho sobe pacotes/*
          cp target/release/magoagent_*_amd64.deb .
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: pacote-linux
          path: |
            MagoAgent-*-linux-x86_64.tar.gz
            magoagent_*_amd64.deb
          if-no-files-found: error
