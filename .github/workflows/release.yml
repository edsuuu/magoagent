# Uma tag v* gera o MSI do Windows e o pacote do Linux numa release em RASCUNHO: publicar é decisão do dono.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # a tag v0.0.17 com o Cargo.toml em 0.0.16 geraria um MSI com o nome errado e o atualizador nunca o acharia
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: A tag bate com a versão do Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::a tag $GITHUB_REF_NAME não bate com a versão $version do Cargo.toml: ajuste a versão ou a tag"
            exit 1
          fi

  windows:
    needs: [ci, version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.8.1
      - name: WiX 3
        shell: bash
        run: |
          curl -sSL -o wix.zip https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip
          mkdir -p "$HOME/tools/wix314/bin" && unzip -q wix.zip -d "$HOME/tools/wix314/bin"
      - name: MSI
        shell: bash
        run: sh installer/build-msi.sh
      - uses: softprops/action-gh-release@v2.2.0
        with:
          draft: true
          files: target/release/MagoAgent-*.msi

  linux:
    needs: [ci, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.8.1
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libasound2-dev libdbus-1-dev libxkbcommon-dev libwayland-dev libssl-dev
      - run: cargo build --release
      - name: Pacote
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tar -czf "MagoAgent-$version-linux-x86_64.tar.gz" -C target/release magoagent
      - uses: softprops/action-gh-release@v2.2.0
        with:
          draft: true
          files: MagoAgent-*-linux-x86_64.tar.gz
