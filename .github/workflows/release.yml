# Uma tag v* gera o MSI do Windows e os pacotes do Linux (.tar.gz e .deb) numa release em RASCUNHO: publicar é decisão
# do dono. Publicada, o apt.yml põe o .deb no repositório apt (GitHub Pages).
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  windows:
    needs: ci
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.8.1
      - name: WiX 3
        shell: bash
        run: |
          curl -sSL -o wix.zip https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip
          mkdir -p "$HOME/tools/wix314/bin" && unzip -q wix.zip -d "$HOME/tools/wix314/bin"
      - name: MSI
        shell: bash
        run: sh installer/build-msi.sh
      - uses: softprops/action-gh-release@v2.2.0
        with:
          draft: true
          files: target/release/MagoAgent-*.msi

  linux:
    needs: ci
    # the oldest Ubuntu still supported: the .deb asks for its libraries' versions, which the newer ones have
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.8.1
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libasound2-dev libdbus-1-dev libxkbcommon-dev libwayland-dev libssl-dev dpkg-dev
      - run: cargo build --release
      - name: Pacotes (.tar.gz e .deb)
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tar -czf "MagoAgent-$version-linux-x86_64.tar.gz" -C target/release magoagent
          sh installer/build-deb.sh
      - uses: softprops/action-gh-release@v2.2.0
        with:
          draft: true
          files: |
            MagoAgent-*-linux-x86_64.tar.gz
            target/release/magoagent_*_amd64.deb
