# O site do MagoAgent (site/) e o repositório apt, no GitHub Pages (ramo gh-pages, refeito do zero a cada execução).
# Com release publicada (o release.yml a deixa em rascunho) e o segredo APT_GPG_PRIVATE_KEY, o .deb dela vira um
# repositório apt simples (flat), assinado com essa chave: `sudo apt install magoagent` depois de adicionar o
# repositório (docs/apt.md). Sem release ou sem segredo, publica só o site, com um aviso.
name: Pages
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  pages:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GPG_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: O site
        run: |
          mkdir out
          cp -r site/. out/
          touch out/.nojekyll
      - name: O repositório apt
        run: |
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          if [ -z "$TAG" ]; then echo "::warning::Sem release publicada: o site sai sem o repositório apt."; exit 0; fi
          if [ -z "$GPG_KEY" ]; then echo "::warning::Falta o segredo APT_GPG_PRIVATE_KEY (docs/apt.md): o site sai sem o repositório apt."; exit 0; fi
          printf '%s\n' "$GPG_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          mkdir -p out/apt
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'magoagent_*_amd64.deb' --dir out/apt
          ls out/apt/*.deb
          cd out/apt
          sudo apt-get update && sudo apt-get install -y apt-utils
          apt-ftparchive packages . > Packages
          gzip -k9 Packages
          apt-ftparchive -o APT::FTPArchive::Release::Origin=MagoAgent -o APT::FTPArchive::Release::Label=MagoAgent \
            -o APT::FTPArchive::Release::Suite=stable -o APT::FTPArchive::Release::Architectures=amd64 release . > Release
          sign() { gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --local-user "$KEY_ID" "$@"; }
          sign --clearsign -o InRelease Release
          sign -abs -o Release.gpg Release
          gpg --export "$KEY_ID" > magoagent.gpg
          gpg --armor --export "$KEY_ID" > magoagent.asc
      - name: Publicar no gh-pages
        working-directory: out
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "site: $GITHUB_SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
