# O repositório apt do MagoAgent, no GitHub Pages: quando o dono publica uma release (o release.yml a deixa em rascunho),
# o .deb dela vai para um repositório apt simples (flat), assinado com a chave GPG do segredo APT_GPG_PRIVATE_KEY, no
# ramo gh-pages, refeito do zero a cada versão (só a última fica). A pessoa instala com `sudo apt install magoagent`
# depois de adicionar o repositório (docs/apt.md). Também roda à mão (Actions › Apt › Run workflow) com a tag.
name: Apt
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "a tag da release (ex.: v0.0.17)"
        required: true
permissions:
  contents: write
concurrency:
  group: apt
  cancel-in-progress: false
jobs:
  apt:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GPG_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
    steps:
      - name: A chave de assinatura
        run: |
          if [ -z "$GPG_KEY" ]; then
            echo "::error::Falta o segredo APT_GPG_PRIVATE_KEY (veja docs/apt.md): sem ele o apt recusa o repositório."
            exit 1
          fi
          printf '%s\n' "$GPG_KEY" | gpg --batch --import
          echo "KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')" >> "$GITHUB_ENV"
      - name: O .deb da release
        run: |
          mkdir -p site/apt
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'magoagent_*_amd64.deb' --dir site/apt
          ls site/apt/*.deb
      - name: O índice, assinado
        working-directory: site/apt
        run: |
          sudo apt-get update && sudo apt-get install -y apt-utils
          apt-ftparchive packages . > Packages
          gzip -k9 Packages
          apt-ftparchive -o APT::FTPArchive::Release::Origin=MagoAgent -o APT::FTPArchive::Release::Label=MagoAgent \
            -o APT::FTPArchive::Release::Suite=stable -o APT::FTPArchive::Release::Architectures=amd64 release . > Release
          sign() { gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --local-user "$KEY_ID" "$@"; }
          sign --clearsign -o InRelease Release
          sign -abs -o Release.gpg Release
          gpg --export "$KEY_ID" > magoagent.gpg
          gpg --armor --export "$KEY_ID" > magoagent.asc
      - name: A página
        run: |
          base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/apt"
          touch site/.nojekyll
          cat > site/index.html <<EOF
          <!doctype html><meta charset="utf-8"><title>MagoAgent no apt</title>
          <h1>MagoAgent no apt</h1>
          <pre>curl -fsSL $base/magoagent.gpg | sudo tee /usr/share/keyrings/magoagent.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/magoagent.gpg] $base ./" | sudo tee /etc/apt/sources.list.d/magoagent.list
          sudo apt update && sudo apt install magoagent</pre>
          EOF
      - name: Publicar no gh-pages
        working-directory: site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "apt: $TAG"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
