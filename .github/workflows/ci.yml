# Compila, verifica qualidade e testa no Windows e no Linux: a cada push na main, em cada pull request e dentro do
# release (release.yml). Uma vez por commit: o push de uma branch com PR e a tag do release rodavam outro igual ao mesmo
# tempo, disputando as máquinas.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
# um push novo no mesmo PR cancela o CI do anterior, que já não vale
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# actions: write deixa um job que falha cancelar a execução inteira (o passo "Parar o resto do CI")
permissions:
  contents: read
  actions: write
jobs:
  fmt:
    name: Formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: rustfmt --edition 2024 --check $(find src -name "*.rs")
      - name: Parar o resto do CI
        if: failure()
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  clippy:
    name: Clippy
    # no Windows: lá todo o código compila (o que só o Windows usa daria "nunca usado" no Linux)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.8.1
      - run: cargo clippy --all-targets --release -- -D warnings
      - name: Parar o resto do CI
        if: failure()
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  auditoria:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.8.1
      - run: cargo install cargo-deny --locked
      - run: cargo deny check
      - name: Parar o resto do CI
        if: failure()
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    name: Testes
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.8.1
      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libasound2-dev libdbus-1-dev libxkbcommon-dev libwayland-dev libssl-dev
      - name: Identidade do git para os testes que fazem commits
        run: git config --global user.name ci && git config --global user.email ci@example.com
      # sem `cargo check` antes: não há examples nem benches, e o `cargo test` já compila tudo o que ele compilaria
      - run: cargo test --release
      - name: Parar o resto do CI
        if: failure()
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  e2e:
    name: Teste de ponta a ponta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.8.1
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libasound2-dev libdbus-1-dev libxkbcommon-dev libwayland-dev libssl-dev xvfb libxkbcommon-x11-0 libgl1-mesa-dri libegl1 libxcursor1 libxrandr2 libxi6
      - name: Criar cena de teste
        run: printf '%s\n' '{"version":1,"elements":[],"background":[255,255,255,255]}' > "$RUNNER_TEMP/teste.mago"
      - name: Compilar
        run: cargo build --release
      - name: Rodar o app e capturar a tela
        run: xvfb-run -a target/release/magoagent
        env:
          MAGOAGENT_SCENE: ${{ runner.temp }}/teste.mago
          MAGOAGENT_SCRIPT: "size 1000 700; wait 3000; shot /tmp/e2e.png; quit"
      - name: Verificar a captura
        run: test -s /tmp/e2e.png
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: e2e-screenshot
          path: /tmp/e2e.png
      - name: Parar o resto do CI
        if: failure()
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
