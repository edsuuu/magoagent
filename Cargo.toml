[package]
name = "magoagent"
version = "0.0.33"
edition = "2024"
authors = ["edsuuu"]
license = "MIT"
description = "MagoAgent: quadro branco nativo em Rust"
# an app, not a library: never goes to crates.io
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "system_fonts", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
rfd = "0.15"
resvg = "0.45"
ttf-parser = "0.25" # already pulled in by resvg; used to check glyph coverage
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4", "serde"] }
alacritty_terminal = "0.26"
# the file tree's HEAD-vs-working diffs
similar = { version = "2", default-features = false, features = ["text"] }
keyring = "4.2.0"
# the vault keeps its secrets through keyring-core directly, so the tests can swap in its mock store
keyring-core = "1"


# the syntax check of the tree (app/filetree/syntax): real parsers, ERROR and MISSING nodes with line and column
tree-sitter = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-php = "0.25"
tree-sitter-rust = "0.24"

# the agents' events (eventos.db): SQLite linked in (C source compiled by cc), no sqlite3 binary on Windows
rusqlite = { version = "0.41", features = ["bundled"] }
hayro = "0.8"
# Localizar nos Arquivos by regular expression
regex = "1"
# the voice call: the microphone and the speaker (the engines are HTTP servers, see src/voice/)
cpal = "0.16"
# portals (web pages on the canvas) use the system's own webview: WebKit on macOS, WebView2 on Windows, WebKitGTK on
# Linux (X11 only, on GTK's thread: app/browser/webkit.rs); the .deb depends on libwebkit2gtk-4.1-0
wry = "0.57"

# the spacing test (src/tests/spacing.rs) reads the code with the lines of its statements
[dev-dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }

# macOS: the window buttons move onto the toolbar row (already in the tree through winit)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSControl", "NSButton", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSApplication", "NSColor", "NSScreen"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSData", "NSDictionary", "NSError", "NSString", "NSFileManager", "NSURL"] }
# the pencil's picture of the circled region (WKWebView snapshot); both already come with wry
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-app-kit", "block2", "WKWebView", "WKSnapshotConfiguration"] }
block2 = "0.6"
# Fechar mantém em segundo plano: the icon in the menu bar (app/system/tray.rs)
tray-icon = "0.21"
# a scripted test window that does not take the person's focus (already in eframe's tree; its
# default features would add Wayland decorations and a font rasterizer eframe doesn't use)
winit = { version = "0.30", default-features = false }
raw-window-handle = "0.6"

# Fechar mantém em segundo plano: the icon by the clock (app/system/tray.rs)
[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
# Ajustes › Integrações › Spotify: what plays, by the system's media controls (already in the tree through wry), and
# the volume by the Windows mixer (Core Audio, the session of Spotify.exe)
windows = { version = "0.62", features = [
    "Media_Control",
    "Storage_Streams",
    "Foundation_Collections",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    # updates: opened again after Windows Update restarts the PC, and when the PC started ("Atualizar depois")
    "Win32_System_Recovery",
    "Win32_System_SystemInformation",
] }

# the island over every window: the X11 backend (XWayland in a Wayland session), the island's input shape, the cursor
# and the work area (app/island/x11.rs); both already in the tree through winit
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false }
x11rb = { version = "0.13", default-features = false, features = ["randr", "shape", "sync"] }
# whether the libraries winit's X11 opens are there, before asking for it (already in the tree through winit)
libloading = "0.8"
# Fechar mantém em segundo plano: the icon in the top bar, an AppIndicator (its library is opened at run time) that GTK
# runs on its own thread (system/gtk.rs, with the portals' pages); without libxdo, which only the copy and paste items of
# menus use
tray-icon = { version = "0.21", default-features = false }
gtk = "0.18"
# the picture of a portal's page (WebKitGTK's snapshot) at wry's own version, and the X11 window that holds the page
# (its id, for the holes the app's menus cut in it): both already in the tree through wry
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
gdkx11 = "0.18"

# the CI runs clippy with `-D warnings`; these are the style lints this codebase goes against on purpose
[lints.clippy]
# painting takes the painter, the rects, the colors and the state side by side
too_many_arguments = "allow"
type_complexity = "allow"
# the tests start from a `Default::default()` and set only the fields their case is about
field_reassign_with_default = "allow"
# the index is also the line or the column being painted
needless_range_loop = "allow"
