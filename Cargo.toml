[package]
name = "magoagent"
version = "0.1.0"
edition = "2024"
description = "MagoAgent: quadro branco nativo em Rust"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "system_fonts", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd = "0.15"
resvg = "0.45"
ttf-parser = "0.25" # already pulled in by resvg; used to check glyph coverage
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
alacritty_terminal = "0.26"
# the IDE node: HEAD-vs-working diffs, and the WebSocket Claude Code's IDE integration talks over
similar = { version = "2", default-features = false, features = ["text"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
keyring = "4.2.0"
# the vault keeps its secrets through keyring-core directly, so the tests can swap in its mock store
keyring-core = "1"
mysql = { version = "28.0.4", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }

mongodb = { version = "3.3", default-features = false, features = ["sync", "rustls-tls", "compat-3-3-0", "bson-2"] }
redis = { version = "0.32", default-features = false, features = ["tls-rustls", "tls-rustls-webpki-roots"] }
json5 = "0.4"
tokio = { version = "1", features = ["rt-multi-thread"] }

postgres = "0.19.14"
tokio-postgres-rustls = { version = "0.14", features = ["ring", "webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# SQLite linked in (C source compiled by cc): no sqlite3 binary on Windows; hooks for the
# deadline, limits to turn ATTACH off
rusqlite = { version = "0.41", features = ["bundled", "hooks", "limits"] }
hayro = "0.8"

# macOS: the window buttons move onto the toolbar row (already in the tree through winit)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSControl", "NSButton", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSData", "NSDictionary", "NSError", "NSString", "NSFileManager", "NSURL"] }
# the pencil's picture of the circled region (WKWebView snapshot); both already come with wry
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-app-kit", "block2", "WKWebView", "WKSnapshotConfiguration"] }
block2 = "0.6"
# a scripted test window that does not take the person's focus (already in eframe's tree; its
# default features would add Wayland decorations and a font rasterizer eframe doesn't use)
winit = { version = "0.30", default-features = false }
raw-window-handle = "0.6"

# portals (web pages on the canvas) use the system's own webview: WebKit on macOS, WebView2 on
# Windows; ponytail: Linux would need GTK/WebKitGTK, so portals there only show their address
[target.'cfg(not(target_os = "linux"))'.dependencies]
wry = "0.57"
