[package]
name = "magoagent"
version = "0.1.0"
edition = "2024"
description = "MagoAgent: quadro branco nativo em Rust"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "system_fonts", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd = "0.15"
resvg = "0.45"
ttf-parser = "0.25" # already pulled in by resvg; used to check glyph coverage
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
alacritty_terminal = "0.26"

# macOS: the window buttons move onto the toolbar row (already in the tree through winit)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSControl", "NSButton"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
raw-window-handle = "0.6"

# portals (web pages on the canvas) use the system's own webview: WebKit on macOS, WebView2 on
# Windows; ponytail: Linux would need GTK/WebKitGTK, so portals there only show their address
[target.'cfg(not(target_os = "linux"))'.dependencies]
wry = "0.57"
