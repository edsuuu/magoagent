[package]
name = "magoagent-tui"
version = "0.1.0"
edition = "2024"
description = "MagoAgent no terminal: o canvas, com desenhos e vários terminais, dentro de um terminal só"

[dependencies]
alacritty_terminal = "0.26"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
